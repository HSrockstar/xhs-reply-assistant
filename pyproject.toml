[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-reply-assistant"
version = "0.1.0"
description = "本地个人回复草稿助手"
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi==0.116.1", "uvicorn==0.35.0", "jinja2==3.1.6", "pydantic==2.11.9",
  "httpx==0.28.1", "python-multipart==0.0.20", "sentence-transformers==5.1.1",
]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "pytest-asyncio==1.2.0", "ruff==0.13.1", "playwright==1.55.0"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
